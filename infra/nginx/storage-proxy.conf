# Проксирование presigned-запросов в хранилище (ADR 0004, дополнение 1).
# Host — постоянный, на него API подписывает ссылки (app/core/storage.py: SIGNING_HOST). Host клиента
# в подпись не входит: API не создаёт клиента подписи на каждый присланный Host (DoS),
# ссылка не зависит от IP/имени, по которому открыт сайт.
proxy_set_header Host media.internal;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Заголовки, которыми клиент мог бы повлиять на выбор host/бакета в хранилище (при MINIO_DOMAIN).
proxy_set_header X-Forwarded-Host "";
proxy_set_header Forwarded "";
# Учётные данные браузера хранилищу не нужны (подпись — в query-строке) и не должны попасть в его
# логи и трассировку: cookie сессии уходит с каждым Range-запросом плеера и PUT части загрузки
# (аудит дня 8). Authorization — заодно: заголовок вместе с подписью в query хранилище отклонит.
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_hide_header Set-Cookie;
proxy_hide_header Server;
proxy_pass http://storage_upstream;
