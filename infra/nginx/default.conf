# Единая точка входа: SPA, API, Swagger и раздача объектов хранилища (presigned URL).
# Postgres и хранилище наружу не публикуются.

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

upstream api_upstream {
    server api:8000;
    keepalive 16;
}

upstream storage_upstream {
    server storage:9000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;

    include /etc/nginx/snippets/security-headers.conf;

    # Все proxy_set_header — только здесь: в nginx location с собственным
    # proxy_set_header перестаёт наследовать заголовки уровня server.
    # Host сохраняется: входит в подпись SigV4 presigned URL (docs/adr/0004).
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    # Перезаписываем, а не дописываем: значение от клиента не должно доходить до приложения.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Проверка пароля: жёсткий лимит против перебора (10/мин с IP, всплеск до 10).
    # Только эндпоинты, где проверяется пароль. /api/auth/me и /logout — в общем лимите:
    # SPA вызывает /me на каждой загрузке страницы.
    location ~ ^/api/auth/(login|register|token)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api_upstream;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api_upstream;
    }

    # Swagger UI тянет JS/CSS с CDN jsdelivr — отдельная CSP только для /docs.
    location = /docs {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'" always;
        proxy_pass http://api_upstream;
    }

    location = /openapi.json {
        proxy_pass http://api_upstream;
    }

    # --- Объектное хранилище: только presigned-запросы (бакеты закрыты).
    # Объекты отдаются с того же origin, что и SPA, поэтому:
    #  - строгая CSP с sandbox — загруженный HTML/JS не исполнится в нашем origin;
    #  - методы ограничены: в raw браузер только загружает части, из media — только читает;
    #  - сырой URI (уходит в хранилище как есть) обязан начинаться с имени бакета,
    #    иначе `/x/../yt-raw/` позволил бы обратиться к другим путям хранилища.
    location /yt-raw/ {
        if ($request_uri !~ "^/yt-raw/[^?]") { return 403; }
        limit_except PUT { deny all; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        client_max_body_size 128m;          # одна часть multipart-загрузки
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_hide_header Server;
        proxy_pass http://storage_upstream;
    }

    location /yt-media/ {
        if ($request_uri !~ "^/yt-media/[^?]") { return 403; }
        limit_except GET { deny all; }      # GET включает HEAD
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        proxy_buffering off;
        proxy_hide_header Server;
        proxy_pass http://storage_upstream;
    }

    # --- SPA ---
    root /usr/share/nginx/html;

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
