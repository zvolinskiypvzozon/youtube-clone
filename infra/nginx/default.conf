# Единая точка входа: SPA, API, Swagger и раздача объектов хранилища (presigned URL).
# Postgres и хранилище наружу не публикуются.

# --- Rate limit (по IP, ADR 0001; лимиты утверждены архитектором 2026-11-10, день 6 шаг 2).
# Ключ зоны задаётся через map: пустой ключ — запрос в зону не попадает (так одна location
# /api/ ограничивает только нужные методы и пути). Ответ на превышение — 429.
map $request_method $write_key {          # все изменяющие запросы
    GET     "";
    HEAD    "";
    OPTIONS "";
    default $binary_remote_addr;
}
map "$request_method $uri" $comment_key {   # новый комментарий
    "~^POST /api/videos/[^/]+/comments$" $binary_remote_addr;
    default "";
}
map "$request_method $uri" $report_key {    # жалоба
    "~^POST /api/videos/[^/]+/reports$" $binary_remote_addr;
    default "";
}
# Поиск: в строке запроса есть параметр q в любом виде. Не $arg_q: nginx берёт первое
# вхождение и не декодирует имя, а бэкенд — последнее и декодирует, поэтому `?q=&q=abc`
# и `?%71=abc` обходили бы зону (ревью шага 2, Medium). Пустой q тоже ограничивается —
# бэкенд ответит 422.
map $args $search_key {
    "~(^|&)(q|%71)(=|&|$)" $binary_remote_addr;
    default "";
}

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $write_key zone=write:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=views:10m rate=30r/m;
limit_req_zone $comment_key zone=comments:10m rate=10r/m;
limit_req_zone $report_key zone=reports:10m rate=5r/m;
limit_req_zone $search_key zone=search:10m rate=5r/s;
limit_req_status 429;

# Для бакетов пишем в лог путь без query-строки: в ней подпись X-Amz-Signature и uploadId,
# по которым до истечения TTL можно было бы дописывать части в чужую загрузку.
log_format storage_noquery '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$http_user_agent"';

# Имена upstream перерешиваются через DNS Docker (127.0.0.11), а не один раз при старте.
# Иначе после пересоздания api (новый IP), когда web не пересоздавался (образ не менялся),
# nginx продолжает ходить на старый адрес → 502 до рестарта web.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_upstream {
    zone api_upstream 64k;
    server api:8000 resolve;
    keepalive 16;
}

upstream storage_upstream {
    zone storage_upstream 64k;
    server storage:9000 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;

    include /etc/nginx/snippets/security-headers.conf;

    # proxy_set_header уровня server. Location с собственным proxy_set_header их НЕ наследует:
    # /yt-raw/ и /yt-media/ повторяют набор целиком (snippets/storage-proxy.conf).
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;  # API сверяет Origin изменяющих запросов с Host
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    # Перезаписываем, а не дописываем: значение от клиента не должно доходить до приложения.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Проверка пароля: жёсткий лимит против перебора (10/мин с IP, всплеск до 10).
    # Только эндпоинты, где проверяется пароль. /api/auth/me и /logout — в общем лимите:
    # SPA вызывает /me на каждой загрузке страницы.
    location ~ ^/api/auth/(login|register|token)$ {
        limit_req zone=auth burst=10 nodelay;
        limit_req zone=write burst=20 nodelay;
        proxy_pass http://api_upstream;
    }

    # Просмотр: плеер шлёт один POST после нескольких секунд воспроизведения.
    location ~ ^/api/videos/[^/]+/view$ {
        limit_req zone=views burst=10 nodelay;
        limit_req zone=write burst=20 nodelay;
        proxy_pass http://api_upstream;
    }

    # Ссылки на поток: плеер перезапрашивает их при истечении (15 мин) и при 403 —
    # вне общих зон, чтобы воспроизведение не упиралось в лимит соседних запросов SPA
    # (решение архитектора 2026-11-10). Сам поток (/yt-media/) и части загрузки
    # (/yt-raw/, все ссылки выдаются одним POST при старте) — отдельные location без зон.
    location ~ ^/api/videos/[^/]+/stream$ {
        proxy_pass http://api_upstream;
    }

    # Лента и поиск (GET /api/videos?q=): поиск — своя зона, лента — общая.
    location = /api/videos {
        limit_req zone=search burst=10 nodelay;
        limit_req zone=api burst=40 nodelay;
        limit_req zone=write burst=20 nodelay;
        proxy_pass http://api_upstream;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=write burst=20 nodelay;
        limit_req zone=comments burst=5 nodelay;
        limit_req zone=reports burst=3 nodelay;
        proxy_pass http://api_upstream;
    }

    # Swagger UI тянет JS/CSS с CDN jsdelivr — отдельная CSP только для /docs.
    location = /docs {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'" always;
        proxy_pass http://api_upstream;
    }

    location = /openapi.json {
        proxy_pass http://api_upstream;
    }

    # --- Объектное хранилище: только presigned-запросы (бакеты закрыты).
    # Объекты отдаются с того же origin, что и SPA, поэтому:
    #  - строгая CSP с sandbox — загруженный HTML/JS не исполнится в нашем origin;
    #  - методы ограничены: в raw браузер только загружает части, из media — только читает;
    #  - сырой URI (уходит в хранилище как есть) обязан начинаться с имени бакета,
    #    иначе `/x/../yt-raw/` позволил бы обратиться к другим путям хранилища.
    location /yt-raw/ {
        if ($request_uri !~ "^/yt-raw/[^?]") { return 403; }
        limit_except PUT { deny all; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        # Одна часть multipart = 16 МиБ (UPLOAD_PART_BYTES) + запас. Длина части к тому же
        # входит в подпись ссылки — хранилище отклонит любую другую.
        client_max_body_size 17m;
        access_log /var/log/nginx/access.log storage_noquery;
        proxy_request_buffering off;
        proxy_buffering off;
        include /etc/nginx/snippets/storage-proxy.conf;
    }

    location /yt-media/ {
        if ($request_uri !~ "^/yt-media/[^?]") { return 403; }
        limit_except GET { deny all; }      # GET включает HEAD
        include /etc/nginx/snippets/security-headers.conf;
        access_log /var/log/nginx/access.log storage_noquery;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        # Байты (в том числе приватного видео) — только в кэше браузера, 15 минут с момента
        # получения (= STREAM_URL_TTL_SECONDS); без заголовка браузер кэшировал бы эвристически
        # по Last-Modified. Без `always`: ответы с ошибками (403/404/416) свежести не получают.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, max-age=900";
        proxy_buffering off;
        include /etc/nginx/snippets/storage-proxy.conf;
    }

    # --- SPA ---
    root /usr/share/nginx/html;

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
