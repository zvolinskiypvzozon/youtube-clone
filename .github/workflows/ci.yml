name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Действия закреплены по SHA коммита (тег можно переставить; версия — в комментарии), все на
# Node 24 (Node 20 у действий выводится из оборота). Обновлять — на версии не моложе двух недель.

jobs:
  lint:
    name: Lint (ruff, eslint, vitest, tsc, shell)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (node24)
        with:
          python-version: "3.12"
      - run: pip install ruff==0.11.8
      - run: ruff check backend scripts && ruff format --check backend scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Shell scripts syntax
        run: bash -n deploy.sh scripts/*.sh && sh -n infra/silo/init.sh

  test:
    name: Tests + stack smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - name: Generate .env
        run: bash scripts/gen-env.sh .env
      - name: Only web publishes ports (K8)
        run: |
          leaked=$(docker compose --profile test config --format json \
            | jq -r '.services | to_entries[] | select(.key != "web" and (.value.ports // [] | length) > 0) | .key')
          if [ -n "$leaked" ]; then echo "Порты опубликованы у: $leaked"; exit 1; fi
      - name: Build images
        run: docker compose --profile test build
      - name: Pytest (real Postgres + storage, isolated test DB/buckets)
        run: docker compose --profile test run --rm tests
      - name: Start full stack
        run: docker compose up -d
      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1/api/health && exit 0
            sleep 3
          done
          exit 1
      - name: Smoke — upload, process, playback, privacy, access, delete (API only)
        run: python3 scripts/smoke.py http://127.0.0.1
      - name: Storage is not reachable without signature
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/yt-media/x)" = "403"
      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=100
      - name: Teardown
        if: always()
        run: docker compose --profile test down -v
